name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ChessArrows-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: ChessArrows-Android
      - uses: actions/upload-artifact@v4
        with:
          name: ChessArrows-apk
          path: ChessArrows-Android/app/build/outputs/apk/debug/app-debug.apk
